<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PACKT — Kendi Düzenini Kur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --linen:      #ebebdc;
      --graphite:   #333132;
      --terracotta: #f54f36;
      --bone:       #d3d2c1;
      --grey:       #777a7d;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--linen);
      color: var(--graphite);
      overflow-x: hidden;
    }

    /* ===== BACKGROUND ===== */
    .p-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .p-bg img {
      position: absolute;
      /* grayscale + contrast lineleri belirginleştirir, brightness koyu yapar */
      filter: grayscale(1) contrast(3) brightness(0.38);
    }

    /* Sol üst: BASE-03 büyük platform */
    .bg-tl {
      width: 82vw;
      top: -8%;
      left: -16%;
      transform: rotate(-5deg);
      opacity: 0.18;
    }

    /* Sağ üst: stant01 stand mekanizması */
    .bg-tr {
      width: 30vw;
      top: 2%;
      right: -4%;
      transform: rotate(-2deg);
      opacity: 0.16;
    }

    /* Sağ alt: BASE-01 küçük platform (ayna) */
    .bg-br {
      width: 58vw;
      bottom: -6%;
      right: -10%;
      transform: rotate(5deg) scaleX(-1);
      opacity: 0.16;
    }

    /* Sol alt: plato06 depolama ünitesi */
    .bg-bl {
      width: 36vw;
      bottom: 2%;
      left: -4%;
      transform: rotate(2deg);
      opacity: 0.14;
    }

    /* ===== CTA ===== */
    .p-cta {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 120px 48px 100px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .p-cta__inner {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .p-cta__logo   { width: 64px; height: 64px; margin-bottom: 4px; opacity: 0; }
    .p-eyebrow     { font-size: 10px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--grey); }
    .p-cta__title  { font-size: clamp(52px, 9vw, 112px); font-weight: 900; letter-spacing: -0.045em; line-height: 0.92; color: var(--graphite); opacity: 0; transform: translateY(80px); }
    .p-cta__sub    { font-size: 15px; color: var(--grey); line-height: 1.7; max-width: 500px; opacity: 0; transform: translateY(32px); }
    .p-cta__actions { display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap; justify-content: center; opacity: 0; transform: translateY(32px); }

    /* ===== BUTTONS ===== */
    .p-btn {
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none; font-family: inherit;
      font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 14px 32px; transition: all 0.25s ease; cursor: pointer; border: none;
    }
    .p-btn--cta   { background: var(--terracotta); color: #fff; border: 1px solid var(--terracotta); }
    .p-btn--cta:hover { background: #d94328; border-color: #d94328; }
    .p-btn--ghost { border: 1px solid var(--bone); color: var(--graphite); background: transparent; }
    .p-btn--ghost:hover { border-color: var(--graphite); }

    @media (max-width: 768px) {
      .p-cta  { padding: 80px 24px 60px; }
      .bg-tl  { width: 150vw; }
      .bg-tr  { display: none; }
      .bg-br  { width: 110vw; }
      .bg-bl  { width: 80vw; }
    }
  </style>
</head>
<body>

  <div class="p-bg">
    <img class="bg-tl" src="assets/svg/BASE-03.svg" alt="">
    <img class="bg-tr" src="assets/svg/stant01.svg" alt="">
    <img class="bg-br" src="assets/svg/BASE-01.svg" alt="">
    <img class="bg-bl" src="assets/svg/plato06.svg" alt="">
  </div>

  <section class="p-cta">
    <div class="p-cta__inner">

      <svg class="p-cta__logo" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
        <path fill="#f54f36" d="M124.3,500v37.57h319.34c10.37,0,18.79,8.41,18.79,18.79v93.92h37.57v-112.71c0-20.75-16.82-37.57-37.57-37.57H124.3Z"/>
        <polygon fill="#f54f36" points="875.7 500 875.7 462.43 556.36 462.43 537.57 443.64 537.57 349.72 500 349.72 500 500 875.7 500"/>
      </svg>

      <p class="p-eyebrow">— Sıra Sizde</p>
      <h2 class="p-cta__title">Kendi<br>Düzenini Kur.</h2>
      <p class="p-cta__sub">Zamanın akışına izin verin. Kendi Packt'inizi inşa edin. Onu eşsiz kılın.</p>
      <div class="p-cta__actions">
        <a href="https://thepackt.co/koleksiyon" class="p-btn p-btn--cta">Koleksiyonu Keşfet</a>
        <a href="https://thepackt.co/moduller" class="p-btn p-btn--ghost">Ürünleri İncele</a>
      </div>

    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
  (function () {
    gsap.to('.p-cta__logo',    { opacity: 1, duration: 0.8, ease: 'power2.out', delay: 0.2 });
    gsap.to('.p-cta__title',   { opacity: 1, y: 0, duration: 1.2, ease: 'power4.out', delay: 0.4 });
    gsap.to('.p-cta__sub',     { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out', delay: 0.8 });
    gsap.to('.p-cta__actions', { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out', delay: 1.0 });
  })();
  </script>
</body>
</html>
